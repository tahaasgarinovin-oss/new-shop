<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h3>Store Panel</h3>
  <button style="width:120px" onclick="logout()">خروج</button>
</div>

<div class="grid">

  <div class="box">
    <h3>📦 محصولات</h3>
    <button onclick="loadProducts()">نمایش</button>
    <div id="products"></div>
  </div>

  <div class="box">
    <h3>💰 کیف پول</h3>
    <button onclick="getWallet()">نمایش</button>
    <div id="wallet"></div>
  </div>

  <div class="box">
    <h3>🛒 سفارشات</h3>
    <button onclick="loadOrders()">نمایش</button>
    <div id="orders"></div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
