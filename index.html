<!DOCTYPE html>

  <div class="cat">هدفون</div>
  <div class="cat">گیمینگ</div>

</div>

<!-- PRODUCTS -->
<div class="container">
  <div class="grid" id="products"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
